[manager]
ratio          = [1, 2, 4]
sort_by        = "natural"
sort_sensitive = false
sort_reverse   = false
show_hidden    = true
show_symlink   = true

[preview]
tab_size   = 2
max_width  = 1200
max_height = 900

[opener]
edit = [
  { run = 'hx "$@"', desc = "Helix", block = true }
]
open = [
  { run = 'xdg-open "$@"', desc = "Open" }
]

[open]
rules = [
  { mime = "text/*",        use = "edit" },
  { mime = "application/json", use = "edit" },
  { mime = "application/toml", use = "edit" },
  { name = "*.md",          use = "edit" },
  { name = "*",             use = "open" },
]

[manager]
ratio          = [1, 2, 4]
sort_by        = "natural"
sort_sensitive = false
sort_reverse   = false
show_hidden    = true
show_symlink   = true

[preview]
tab_size   = 2
max_width  = 1200
max_height = 900

[opener]
edit = [
  { run = 'hx "$@"', desc = "Helix", block = true }
]

# yazi/open.sh = xdg-open without the portal chooser, and focus stays on the
# terminal while the viewer opens (see the comments in that script).
open = [
  { run = '"${XDG_CONFIG_HOME:-$HOME/.config}/yazi/open.sh" "$@"', desc = "Open" }
]

[open]
rules = [
  { mime = "text/*",              use = "edit" },
  { mime = "application/json",    use = "edit" },
  { mime = "application/toml",    use = "edit" },
  { mime = "text/markdown",       use = "edit" },
  { mime = "*",                   use = "open" },
]

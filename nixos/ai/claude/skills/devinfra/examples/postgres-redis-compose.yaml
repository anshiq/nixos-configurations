# todo: shared-infrastructure Compose (generated by devinfra).
# Reused services are NOT declared here; the app joins them over dev-services.
# Set the env vars below in your project .env (passwords never stored in this file).

services:
  app:
    build: .
    environment:
      DATABASE_URL: ${DATABASE_URL} # postgres://todo_user:****@postgres:5432/todo_db
      REDIS_URL: ${REDIS_URL}       # redis://redis:6379/0, keys prefixed "todo:"
    networks:
      - shared-dev

networks:
  shared-dev:
    external: true
    name: dev-services

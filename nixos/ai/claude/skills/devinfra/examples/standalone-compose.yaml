# todo: standalone Compose (generated by devinfra --standalone).
# Self-contained fallback: project-scoped containers. Prefer shared mode when available.

services:
  app:
    build: .
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@todo-postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://todo-redis:6379/0
    depends_on:
      - todo-postgres
      - todo-redis

  todo-postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-todo_db}
      POSTGRES_USER: ${POSTGRES_USER:-todo_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
    volumes:
      - todo-pgdata:/var/lib/postgresql/data

  todo-redis:
    image: redis:7-alpine
    volumes:
      - todo-redisdata:/data

volumes:
  todo-pgdata:
  todo-redisdata:

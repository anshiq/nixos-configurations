<!-- Wallpaper template: __BG__/__FG__/__BRIGHT__/__ACCENT__/__ACCENT2__/__MUTED__
     are placeholders substituted per-theme by waybar/scripts/render-wallpaper.sh
     (values pulled from the active theme's quickshell theme.json) - this file
     itself is never shown as-is. See theme-switch.sh for the render call. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
<rect width="1920" height="1080" fill="__BG__"/>
<style>
  text { font-family: JetBrainsMono Nerd Font Mono, JetBrainsMono Nerd Font, monospace; }
  .name { font-weight: 700; font-size: 21px; fill: __BRIGHT__; }
  .key { font-weight: 700; font-size: 15px; fill: __ACCENT2__; }
  .desc { font-size: 15px; fill: __FG__; }
  .foot { font-size: 13px; fill: __MUTED__; }
</style>
